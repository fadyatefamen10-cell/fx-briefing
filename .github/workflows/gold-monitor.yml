name: gold-monitor
on:
  schedule:
    - cron: "*/15 6-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 gold_monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "gold-monitor"
          git config user.email "gold-monitor@users.noreply.github.com"
          git add state.json reports || true
          git diff --cached --quiet || (git commit -m "monitor update" && git pull --rebase -q && git push)
